<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠負債概日リズム計算ツール</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-center text-indigo-400 mb-2">睡眠負債 概日リズム計算ツール</h1>
  <p class="text-center text-gray-400 text-sm mb-6">7日間の睡眠データを入力して睡眠負債と概日リズムを分析</p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Input Section -->
    <div class="bg-gray-800 rounded-xl p-5">
      <h2 class="text-lg font-semibold text-indigo-300 mb-4">睡眠記録入力</h2>
      <div class="space-y-3" id="sleep-inputs">
        <!-- Generated by JS -->
      </div>
      <div class="mt-4 flex gap-3">
        <button onclick="calculate()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded-lg transition" aria-label="計算実行">計算する</button>
        <button onclick="clearData()" class="bg-gray-600 hover:bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg transition" aria-label="データクリア">クリア</button>
      </div>
    </div>

    <!-- Results Section -->
    <div class="bg-gray-800 rounded-xl p-5">
      <h2 class="text-lg font-semibold text-indigo-300 mb-4">分析結果</h2>
      <div id="results" class="text-gray-400 text-sm">データを入力して計算ボタンを押してください。</div>
    </div>
  </div>

  <!-- Chart -->
  <div class="bg-gray-800 rounded-xl p-5 mt-6">
    <h2 class="text-lg font-semibold text-indigo-300 mb-4">日次睡眠時間グラフ</h2>
    <div id="chart-container" class="relative h-48 flex items-end gap-2 px-4">
      <div class="text-gray-500 text-sm">データなし</div>
    </div>
    <div id="chart-legend" class="mt-2 flex flex-wrap gap-4 text-xs text-gray-400 justify-center"></div>
  </div>

  <!-- Sleep Score -->
  <div id="score-section" class="hidden bg-gray-800 rounded-xl p-5 mt-6">
    <h2 class="text-lg font-semibold text-indigo-300 mb-4">睡眠スコアと改善提案</h2>
    <div id="score-content"></div>
  </div>
</div>

<script>
const DAYS = ['月','火','水','木','金','土','日'];
const RECOMMENDED = 8;

function initInputs() {
  const container = document.getElementById('sleep-inputs');
  const saved = JSON.parse(localStorage.getItem('sleepData') || '{}');
  container.innerHTML = DAYS.map((day, i) => `
    <div class="flex items-center gap-3">
      <span class="w-6 text-sm text-gray-400 font-medium">${day}</span>
      <div class="flex-1 grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-gray-500 block mb-1">就寝時刻</label>
          <input type="time" id="bed-${i}" value="${saved[`bed-${i}`] || ''}"
            class="w-full bg-gray-700 border border-gray-600 text-gray-100 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-400"
            aria-label="${day}曜日就寝時刻">
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1">起床時刻</label>
          <input type="time" id="wake-${i}" value="${saved[`wake-${i}`] || ''}"
            class="w-full bg-gray-700 border border-gray-600 text-gray-100 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-400"
            aria-label="${day}曜日起床時刻">
        </div>
      </div>
    </div>
  `).join('');
}

function timeToMinutes(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function getSleepDuration(bedMin, wakeMin) {
  if (bedMin === null || wakeMin === null) return null;
  let dur = wakeMin - bedMin;
  if (dur < 0) dur += 1440;
  return dur / 60;
}

function getMidSleep(bedMin, wakeMin) {
  if (bedMin === null || wakeMin === null) return null;
  let dur = wakeMin - bedMin;
  if (dur < 0) dur += 1440;
  let mid = bedMin + dur / 2;
  if (mid >= 1440) mid -= 1440;
  return mid;
}

function stdDev(arr) {
  const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
  const variance = arr.reduce((s, v) => s + (v - mean) ** 2, 0) / arr.length;
  return Math.sqrt(variance);
}

function calculate() {
  const data = {};
  const durations = [];
  const bedTimes = [];
  const midSleeps = [];
  const wakeTimes = [];

  for (let i = 0; i < 7; i++) {
    const bed = document.getElementById(`bed-${i}`).value;
    const wake = document.getElementById(`wake-${i}`).value;
    data[`bed-${i}`] = bed;
    data[`wake-${i}`] = wake;

    const bedMin = timeToMinutes(bed);
    const wakeMin = timeToMinutes(wake);
    const dur = getSleepDuration(bedMin, wakeMin);
    durations.push(dur);

    if (bedMin !== null) bedTimes.push(bedMin);
    if (wakeMin !== null) wakeTimes.push(wakeMin);
    const mid = getMidSleep(bedMin, wakeMin);
    if (mid !== null) midSleeps.push(mid);
  }

  localStorage.setItem('sleepData', JSON.stringify(data));

  const validDurs = durations.filter(d => d !== null);
  if (validDurs.length === 0) {
    document.getElementById('results').innerHTML = '<span class="text-red-400">少なくとも1日分のデータを入力してください。</span>';
    return;
  }

  const totalSleep = validDurs.reduce((a, b) => a + b, 0);
  const avgSleep = totalSleep / validDurs.length;
  const totalDebt = validDurs.reduce((s, d) => s + Math.max(0, RECOMMENDED - d), 0);
  const weekendExtra = Math.min(totalDebt / 2, 4);

  // Circadian metrics
  const bedStdDev = bedTimes.length >= 2 ? stdDev(bedTimes) / 60 : null;

  // MSFsc: midpoint of sleep on free days (Sat=5, Sun=6)
  let msf = null;
  const freeMidSleeps = [5, 6].map(i => {
    const bed = timeToMinutes(document.getElementById(`bed-${i}`).value);
    const wake = timeToMinutes(document.getElementById(`wake-${i}`).value);
    return getMidSleep(bed, wake);
  }).filter(m => m !== null);

  if (freeMidSleeps.length > 0) {
    msf = freeMidSleeps.reduce((a, b) => a + b, 0) / freeMidSleeps.length;
    // Correct for sleep debt: MSFsc = MSF - 0.5 * (SD_free - SD_week)
    const workMids = midSleeps.slice(0, 5).filter(m => m !== null);
    if (workMids.length > 0) {
      const sdFree = freeMidSleeps.length > 1 ? stdDev(freeMidSleeps) / 60 : (avgSleep > 0 ? avgSleep : 0);
      const sdWeek = workMids.length > 0 ? workMids.reduce((s, m) => {
        const bedM = timeToMinutes(document.getElementById(`bed-${midSleeps.indexOf(m)}`).value);
        const wakeM = timeToMinutes(document.getElementById(`wake-${midSleeps.indexOf(m)}`).value);
        const dur = getSleepDuration(bedM, wakeM);
        return s + (dur || 0);
      }, 0) / workMids.length : avgSleep;
      msf = msf - 0.5 * Math.max(0, sdFree - sdWeek / 60);
    }
  }

  const msfHours = msf !== null ? `${Math.floor(msf / 60)}:${String(Math.round(msf % 60)).padStart(2, '0')}` : null;

  // SJL: Social Jetlag
  const workBeds = bedTimes.slice(0, 5);
  const freeBeds = bedTimes.slice(5);
  let sjl = null;
  if (workBeds.length > 0 && freeBeds.length > 0) {
    const avgWorkBed = workBeds.reduce((a, b) => a + b, 0) / workBeds.length;
    const avgFreeBed = freeBeds.reduce((a, b) => a + b, 0) / freeBeds.length;
    sjl = Math.abs(avgFreeBed - avgWorkBed) / 60;
  }

  // Score
  const score = Math.max(0, Math.min(100, Math.round(
    (avgSleep / RECOMMENDED) * 50 +
    (bedStdDev !== null ? Math.max(0, 25 - bedStdDev * 10) : 12.5) +
    (sjl !== null ? Math.max(0, 25 - sjl * 8) : 12.5)
  )));

  renderResults(validDurs.length, avgSleep, totalDebt, weekendExtra, bedStdDev, msfHours, sjl, score);
  renderChart(durations);
  renderScore(score, avgSleep, totalDebt, bedStdDev, sjl);
}

function renderResults(days, avg, debt, weekendExtra, bedStd, msfHours, sjl, score) {
  const r = document.getElementById('results');
  r.innerHTML = `
    <div class="space-y-3">
      <div class="bg-gray-700 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">データ日数</div>
        <div class="text-xl font-bold text-white">${days}日間</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-xs text-gray-400 mb-1">平均睡眠時間</div>
          <div class="text-xl font-bold ${avg >= 7 ? 'text-green-400' : avg >= 6 ? 'text-yellow-400' : 'text-red-400'}">${avg.toFixed(1)}h</div>
        </div>
        <div class="bg-gray-700 rounded-lg p-3">
          <div class="text-xs text-gray-400 mb-1">累積睡眠負債</div>
          <div class="text-xl font-bold ${debt <= 2 ? 'text-green-400' : debt <= 5 ? 'text-yellow-400' : 'text-red-400'}">${debt.toFixed(1)}h</div>
        </div>
      </div>
      <div class="bg-gray-700 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">返済に必要な週末の追加睡眠</div>
        <div class="text-xl font-bold text-indigo-400">${weekendExtra.toFixed(1)}h</div>
        <div class="text-xs text-gray-500 mt-1">（最大4時間まで）</div>
      </div>
      ${bedStd !== null ? `
      <div class="bg-gray-700 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">就床時刻の標準偏差</div>
        <div class="text-xl font-bold ${bedStd <= 0.5 ? 'text-green-400' : bedStd <= 1 ? 'text-yellow-400' : 'text-red-400'}">${bedStd.toFixed(2)}h</div>
      </div>` : ''}
      ${msfHours !== null ? `
      <div class="bg-gray-700 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">MSFsc（社会的時差ボケ指数）</div>
        <div class="text-xl font-bold text-purple-400">${msfHours}</div>
        <div class="text-xs text-gray-500 mt-1">休日の睡眠中間点（補正済）</div>
      </div>` : ''}
      ${sjl !== null ? `
      <div class="bg-gray-700 rounded-lg p-3">
        <div class="text-xs text-gray-400 mb-1">社会的時差ボケ（SJL）</div>
        <div class="text-xl font-bold ${sjl <= 0.5 ? 'text-green-400' : sjl <= 1 ? 'text-yellow-400' : 'text-red-400'}">${sjl.toFixed(2)}h</div>
      </div>` : ''}
    </div>
  `;
}

function renderChart(durations) {
  const container = document.getElementById('chart-container');
  const max = Math.max(...durations.filter(d => d !== null), RECOMMENDED, 10);
  const height = 160;

  container.innerHTML = durations.map((d, i) => {
    const hasData = d !== null;
    const barH = hasData ? Math.round((d / max) * height) : 10;
    const recH = Math.round((RECOMMENDED / max) * height);
    const isDebt = hasData && d < RECOMMENDED;
    return `
      <div class="flex-1 flex flex-col items-center gap-1">
        <div class="text-xs text-gray-400">${hasData ? d.toFixed(1) : '-'}</div>
        <div class="w-full relative" style="height:${height}px">
          <div class="absolute bottom-0 w-full rounded-t transition-all"
            style="height:${barH}px; background:${!hasData ? '#374151' : isDebt ? '#f87171' : '#6366f1'}"></div>
          <div class="absolute w-full border-t-2 border-dashed border-yellow-500/60"
            style="bottom:${recH}px"></div>
        </div>
        <div class="text-xs text-gray-500">${DAYS[i]}</div>
      </div>
    `;
  }).join('');

  document.getElementById('chart-legend').innerHTML = `
    <span><span class="inline-block w-3 h-3 bg-indigo-500 rounded-sm mr-1"></span>実際の睡眠</span>
    <span><span class="inline-block w-3 h-3 bg-red-400 rounded-sm mr-1"></span>睡眠負債</span>
    <span><span class="inline-block w-3 h-1 border-t-2 border-dashed border-yellow-500 mr-1" style="display:inline-block;vertical-align:middle"></span>推奨8h</span>
  `;
}

function renderScore(score, avg, debt, bedStd, sjl) {
  const section = document.getElementById('score-section');
  const content = document.getElementById('score-content');
  section.classList.remove('hidden');

  const color = score >= 80 ? 'text-green-400' : score >= 60 ? 'text-yellow-400' : 'text-red-400';
  const label = score >= 80 ? '優秀' : score >= 60 ? '普通' : '要改善';

  const tips = [];
  if (avg < 7) tips.push('💤 平均睡眠時間が不足しています。就寝を30分早めることから始めましょう。');
  if (debt > 5) tips.push('⚠️ 睡眠負債が大きいです。週末に少し多めに眠って返済しましょう（ただし2h以内に留める）。');
  if (bedStd !== null && bedStd > 1) tips.push('🕐 就寝時刻が不規則です。毎日同じ時刻に就寝・起床する習慣をつけましょう。');
  if (sjl !== null && sjl > 1) tips.push('🌙 社会的時差ボケが大きいです。平日と休日の就寝時刻の差を1時間以内に抑えましょう。');
  if (tips.length === 0) tips.push('✅ 良好な睡眠パターンが維持できています！このまま継続しましょう。');

  content.innerHTML = `
    <div class="flex items-center gap-6 mb-4">
      <div class="text-center">
        <div class="text-6xl font-bold ${color}">${score}</div>
        <div class="text-sm text-gray-400 mt-1">睡眠スコア</div>
        <div class="text-sm font-semibold ${color}">${label}</div>
      </div>
      <div class="flex-1">
        <div class="w-full bg-gray-700 rounded-full h-4 mb-2">
          <div class="h-4 rounded-full transition-all ${score >= 80 ? 'bg-green-500' : score >= 60 ? 'bg-yellow-500' : 'bg-red-500'}"
            style="width:${score}%"></div>
        </div>
        <div class="text-xs text-gray-500">0（最低） ← → 100（満点）</div>
      </div>
    </div>
    <div class="space-y-2">
      ${tips.map(t => `<div class="bg-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300">${t}</div>`).join('')}
    </div>
  `;
}

function clearData() {
  localStorage.removeItem('sleepData');
  document.querySelectorAll('input[type="time"]').forEach(el => el.value = '');
  document.getElementById('results').innerHTML = 'データを入力して計算ボタンを押してください。';
  document.getElementById('chart-container').innerHTML = '<div class="text-gray-500 text-sm">データなし</div>';
  document.getElementById('chart-legend').innerHTML = '';
  document.getElementById('score-section').classList.add('hidden');
}

initInputs();
</script>
</body>
</html>
